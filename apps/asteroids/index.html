<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Asteroids Infinite - Playground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
  body { background:#040507; overflow:hidden; font-family: 'Courier New', monospace; color:#fff; }
  canvas { display:block; position:absolute; top:0; left:0; background:radial-gradient(ellipse at center, #0a0e1a 0%, #040507 70%); }
  #ui { position:absolute; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; pointer-events:none; font-size:14px; z-index:10; }
  #ui div { background:rgba(0,0,0,0.6); border:1px solid #1e293b; padding:8px 12px; border-radius:999px; backdrop-filter:blur(6px); }
  #level { color:#38bdf8; } #score { color:#facc15; } #lives { color:#fb7185; }
  #center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:20; background:rgba(4,5,7,0.85); backdrop-filter:blur(8px); }
  #center.hidden { display:none; }
  h1 { font-size:48px; letter-spacing:0.2em; text-shadow:0 0 20px #38bdf8; margin-bottom:10px; }
  #center p { opacity:0.7; margin:6px 0; text-align:center; max-width:360px; line-height:1.5; }
  button.primary { margin-top:20px; padding:14px 28px; border-radius:999px; border:1px solid #38bdf8; background:#0c4a6e; color:#fff; font-family:inherit; font-size:16px; cursor:pointer; box-shadow:0 0 20px rgba(56,189,248,0.4); }
  button.primary:active { transform:scale(0.97); }
  #controls { position:absolute; bottom:0; left:0; right:0; height:170px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 12px 12px; z-index:15; pointer-events:none; }
  .touch-group { display:flex; gap:10px; align-items:flex-end; pointer-events:auto; }
  .tbtn { width:62px; height:62px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; backdrop-filter:blur(8px); }
  .tbtn:active { background:rgba(56,189,248,0.3); border-color:#38bdf8; }
  #thrustBtn { width:78px; height:78px; }
  #shootBtn { width:92px; height:92px; background:rgba(250,204,21,0.12); border-color:rgba(250,204,21,0.4); font-size:28px; box-shadow:0 0 20px rgba(250,204,21,0.2); }
  #shootBtn:active { background:rgba(250,204,21,0.3); }
  #touchNote { position:absolute; bottom:180px; left:0; right:0; text-align:center; opacity:0.35; font-size:11px; letter-spacing:0.1em; pointer-events:none; }
  @media (min-width:768px) { #controls { display:none; } #touchNote { display:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div><span id="level">LVL 1</span> • <span id="score">0</span> • <span id="lives">♥♥♥</span></div>
  <div id="stats">AST: 0 | FPS: 60</div>
</div>
<div id="touchNote">KEYBOARD: WASD/ARROWS + SPACE • PHONE: USE BUTTONS BELOW</div>
<div id="controls">
  <div class="touch-group">
    <button class="tbtn" id="leftBtn">↺</button>
    <button class="tbtn" id="thrustBtn">▲</button>
    <button class="tbtn" id="rightBtn">↻</button>
  </div>
  <div class="touch-group">
    <button class="tbtn" id="shootBtn">◎</button>
  </div>
</div>
<div id="center">
  <h1>ASTEROIDS</h1>
  <p><strong style="color:#38bdf8">INFINITE</strong> • Density, HP and Score scale forever</p>
  <p style="font-size:13px">Level up every 30s: more asteroids, tougher hull, faster, more points</p>
  <p style="font-size:12px; opacity:0.5">Ship wraps • Asteroids split • Touch + Keyboard</p>
  <button class="primary" id="startBtn">▶ PLAY</button>
  <p id="highScoreTxt" style="margin-top:18px;font-size:12px;color:#facc15"></p>
  <p style="margin-top:12px;font-size:11px"><a href="../../" style="color:#64748b">← playground</a> • <a href="../hello/" style="color:#64748b">hello demo</a></p>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); addEventListener('resize',resize);

const state={ running:false, score:0, lives:3, level:1, time:0, lastSpawn:0, spawnInterval:2000, asteroids:[], bullets:[], particles:[], keys:{}, touch:{left:false,right:false,thrust:false,shoot:false}, lastTime:0, fps:60 };

const ship={ x:0,y:0, angle:-Math.PI/2, vx:0,vy:0, r:14, inv:0, thrusting:false, cooldown:0 };

const levelUi=document.getElementById('level'), scoreUi=document.getElementById('score'), livesUi=document.getElementById('lives'), statsUi=document.getElementById('stats'), center=document.getElementById('center'), highTxt=document.getElementById('highScoreTxt');

let high=parseInt(localStorage.getItem('asteroids_high')||'0'); highTxt.textContent=high?`HIGH ${high}`:'No high score yet';

function resetShip(){ ship.x=W/2; ship.y=H/2; ship.vx=0; ship.vy=0; ship.angle=-Math.PI/2; ship.inv=180; }
function wrap(o){ if(o.x<-50)o.x=W+50; if(o.x>W+50)o.x=-50; if(o.y<-50)o.y=H+50; if(o.y>H+50)o.y=-50; }

function randPoly(radius, irregularity){ const n=7+Math.floor(Math.random()*5); const pts=[]; for(let i=0;i<n;i++){ const ang=(i/n)*Math.PI*2; const r=radius*(0.7+Math.random()*0.6*irregularity); pts.push([Math.cos(ang)*r, Math.sin(ang)*r]); } return pts; }

function spawnAsteroid(edge=true, forcedR=null){
  const level=state.level;
  const baseR=forcedR|| (30+Math.random()*40 + level*1.2);
  const hp = Math.max(1, Math.floor(1 + level*0.6 + Math.random()*level*0.4 + (baseR>45?1:0)));
  const speed = (0.6 + Math.random()*1.2 + level*0.18) * (0.7+Math.random()*0.6);
  let x,y,ang;
  if(edge){ const side=Math.floor(Math.random()*4); if(side===0){x=-60; y=Math.random()*H; ang=Math.random()*0.8-0.4} else if(side===1){x=W+60; y=Math.random()*H; ang=Math.PI+Math.random()*0.8-0.4} else if(side===2){x=Math.random()*W; y=-60; ang=Math.PI/2+Math.random()*0.8-0.4} else {x=Math.random()*W; y=H+60; ang=-Math.PI/2+Math.random()*0.8-0.4} } else { x=ship.x + (Math.random()>0.5?1:-1)*(200+Math.random()*W*0.3); y=ship.y + (Math.random()>0.5?1:-1)*(200+Math.random()*H*0.3); ang=Math.random()*Math.PI*2; }
  state.asteroids.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, r:baseR, hp, maxHp:hp, poly:randPoly(baseR,1), rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.04, hitFlash:0 });
}

function levelConfig(l){
  return {
    spawnInterval: Math.max(280, 2100 - l*140),
    density: Math.floor(3 + l*0.9),
    speedMult: 1 + l*0.12,
    hpBonus: Math.floor(l*0.6)
  };
}

function addScore(asteroid){
  const base = asteroid.maxHp * (asteroid.r>40? 35 : asteroid.r>25? 20 : 10);
  const mult = 1 + state.level*0.22 + state.time/60000;
  const pts = Math.floor(base*mult);
  state.score+=pts;
  // floating text
  state.particles.push({ x:asteroid.x, y:asteroid.y, vx:(Math.random()-0.5)*1.2, vy:-1.2, life:60, max:60, type:'text', txt:`+${pts}`, color:'#facc15' });
}

function explode(x,y, r, color='#38bdf8', count= 12){
  for(let i=0;i<count;i++){ state.particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:20+Math.random()*20, max:40, type:'dot', color, size:1+Math.random()*3 }); }
  for(let i=0;i<r/8;i++){ state.particles.push({ x,y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:40+Math.random()*20, max:60, type:'chunk', color, size:1+Math.random()*2 }); }
}

function updateKeys(){
  if(state.keys['ArrowLeft']||state.keys['a']||state.touch.left) ship.angle-=0.08;
  if(state.keys['ArrowRight']||state.keys['d']||state.touch.right) ship.angle+=0.08;
  if(state.keys['ArrowUp']||state.keys['w']||state.touch.thrust){ ship.thrusting=true; const thrust=0.18; ship.vx+=Math.cos(ship.angle)*thrust; ship.vy+=Math.sin(ship.angle)*thrust; if(Math.random()<0.6) state.particles.push({ x: ship.x - Math.cos(ship.angle)*ship.r, y: ship.y - Math.sin(ship.angle)*ship.r, vx: ship.vx + (Math.random()-0.5)*2 - Math.cos(ship.angle)*2, vy: ship.vy + (Math.random()-0.5)*2 - Math.sin(ship.angle)*2, life:12, max:12, type:'dot', color:'#fb7185', size:2 }); } else ship.thrusting=false;
  if((state.keys[' ']||state.keys['Space']||state.touch.shoot) && ship.cooldown<=0 && state.running){ state.bullets.push({ x: ship.x + Math.cos(ship.angle)*ship.r, y: ship.y + Math.sin(ship.angle)*ship.r, vx: Math.cos(ship.angle)*7 + ship.vx*0.3, vy: Math.sin(ship.angle)*7 + ship.vy*0.3, life:60 }); ship.cooldown=9; }
  ship.vx*=0.99; ship.vy*=0.99;
  ship.x+=ship.vx; ship.y+=ship.vy; wrap(ship);
  if(ship.cooldown>0) ship.cooldown--;
  if(ship.inv>0) ship.inv--;
}

function update(dt){
  state.time+=dt;
  const newLevel=1+Math.floor(state.time/30000);
  if(newLevel!==state.level){ state.level=newLevel; state.particles.push({ x:W/2, y:100, vx:0, vy:-0.5, life:120, max:120, type:'text', txt:`LEVEL ${state.level}`, color:'#38bdf8' }); }
  const cfg=levelConfig(state.level);
  state.spawnInterval=cfg.spawnInterval;

  if(state.running && performance.now()-state.lastSpawn > state.spawnInterval){
    const count=1+Math.floor(Math.random()*(cfg.density>5?2:1));
    for(let i=0;i<count;i++) spawnAsteroid(true);
    state.lastSpawn=performance.now();
    // extra pressure: occasional wave
    if(Math.random()<0.12+state.level*0.02){ for(let i=0;i<2+Math.floor(state.level/3);i++) spawnAsteroid(true, 20+Math.random()*25); }
  }

  // bullets
  for(let i=state.bullets.length-1;i>=0;i--){ const b=state.bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--; if(b.life<=0|| b.x<-100||b.x>W+100||b.y<-100||b.y>H+100) state.bullets.splice(i,1); }

  // asteroids
  for(let i=state.asteroids.length-1;i>=0;i--){ const a=state.asteroids[i]; a.x+=a.vx; a.y+=a.vy; a.rot+=a.rotV; wrap(a); if(a.hitFlash>0) a.hitFlash--; // bullet hits
    for(let j=state.bullets.length-1;j>=0;j--){ const b=state.bullets[j]; const dx=b.x-a.x, dy=b.y-a.y; if(dx*dx+dy*dy < a.r*a.r){ state.bullets.splice(j,1); a.hp--; a.hitFlash=6; explode(b.x,b.y,4, a.maxHp>2?'#f87171':'#38bdf8', 3); if(a.hp<=0){ addScore(a); explode(a.x,a.y,a.r, a.maxHp>2?'#fb7185':'#e2e8f0', Math.floor(a.r/2.5)); // split
      if(a.r>22){ const kids= a.r>40?3:2; for(let k=0;k<kids;k++){ const nr=a.r*0.55; const nang=Math.random()*Math.PI*2; const nspd= (Math.random()*1+0.6)*(1+state.level*0.05); state.asteroids.push({ x:a.x + Math.cos(nang)*10, y:a.y + Math.sin(nang)*10, vx: a.vx*0.5 + Math.cos(nang)*nspd, vy: a.vy*0.5 + Math.sin(nang)*nspd, r:nr, hp: Math.max(1, Math.floor(a.maxHp*0.6)), maxHp: Math.max(1, Math.floor(a.maxHp*0.6)), poly:randPoly(nr,1), rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.08, hitFlash:0 }); } } state.asteroids.splice(i,1); break; } } }
    // ship collision
    if(state.running && ship.inv<=0){ const dx=ship.x-a.x, dy=ship.y-a.y; if(dx*dx+dy*dy < (a.r+ship.r)*(a.r+ship.r)*0.7){ state.lives--; explode(ship.x,ship.y, ship.r, '#ffffff', 24); resetShip(); state.particles.push({ x:W/2, y:H/2, vx:0, vy:0, life:90, max:90, type:'text', txt: state.lives>0?`HIT! -1 LIFE`:`DESTROYED`, color:'#fb7185' }); if(state.lives<=0){ gameOver(); } break; } }
  }

  // particles
  for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.life--; if(p.life<=0) state.particles.splice(i,1); }

  levelUi.textContent=`LVL ${state.level}`; scoreUi.textContent=`${state.score}`; livesUi.textContent='♥'.repeat(state.lives)+'♡'.repeat(3-state.lives); statsUi.textContent=`AST: ${state.asteroids.length} | RATE: ${(1000/state.spawnInterval*60).toFixed(1)}/m | x${(1+state.level*0.22).toFixed(1)}`;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // starfield
  ctx.fillStyle='rgba(255,255,255,0.4)'; for(let i=0;i<80;i++){ const x=(i*137.5)%W, y=(i*73.3 + state.time*0.02)%H; ctx.fillRect(x,y, (i%3?1:1.5), (i%3?1:1.5)); }
  // asteroids
  for(const a of state.asteroids){
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
    const hpPct=a.hp/a.maxHp;
    ctx.strokeStyle= a.hitFlash>0? '#fff' : hpPct<0.4?'#fb7185': a.maxHp>2?'#fbbf24':'#e2e8f0';
    ctx.lineWidth= a.maxHp>2?2.2:1.6;
    ctx.shadowColor= a.maxHp>2?'#fbbf24':'#38bdf8'; ctx.shadowBlur= a.hitFlash?12: a.maxHp>2?10:6;
    ctx.beginPath(); const pts=a.poly; ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.stroke();
    // hp bar for tough
    if(a.maxHp>1){ ctx.shadowBlur=0; ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(-a.r, -a.r-12, a.r*2, 4); ctx.fillStyle= hpPct<0.4?'#ef4444':'#22c55e'; ctx.fillRect(-a.r, -a.r-12, a.r*2*hpPct, 4); ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.fillText(`${a.hp}`,0,-a.r-18); }
    ctx.restore();
  }
  // bullets
  ctx.fillStyle='#facc15'; ctx.shadowColor='#facc15'; ctx.shadowBlur=8; for(const b of state.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,Math.PI*2); ctx.fill(); } ctx.shadowBlur=0;
  // ship
  if(state.running || state.lives>0){
    ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.angle);
    const flick= ship.inv>0 && Math.floor(ship.inv/6)%2===0;
    if(!flick){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.shadowColor='#38bdf8'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(ship.r,0); ctx.lineTo(-ship.r*0.7, -ship.r*0.7); ctx.lineTo(-ship.r*0.4,0); ctx.lineTo(-ship.r*0.7, ship.r*0.7); ctx.closePath(); ctx.stroke(); if(ship.thrusting){ ctx.strokeStyle='#fb7185'; ctx.shadowColor='#fb7185'; ctx.beginPath(); ctx.moveTo(-ship.r*0.4, -4); ctx.lineTo(-ship.r*1.4 + (Math.random()*6),0); ctx.lineTo(-ship.r*0.4,4); ctx.stroke(); } }
    ctx.restore();
    if(ship.inv>0){ ctx.strokeStyle=`rgba(56,189,248,${ship.inv/180})`; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(ship.x,ship.y, ship.r+10+ (180-ship.inv)/10,0,Math.PI*2); ctx.stroke(); }
  }
  // particles
  for(const p of state.particles){
    const alpha=p.life/p.max;
    if(p.type==='dot'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    else if(p.type==='chunk'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); ctx.globalAlpha=1; }
    else if(p.type==='text'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.fillText(p.txt, p.x,p.y); ctx.globalAlpha=1; }
  }
}

let last=0, fpsAcc=0, fpsCount=0;
function loop(t){
  const dt=Math.min(33, t-last); last=t; fpsAcc+=1000/dt; fpsCount++; if(fpsCount>30){ state.fps=Math.round(fpsAcc/fpsCount); fpsAcc=0; fpsCount=0; }
  if(state.running){ updateKeys(); update(dt); }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){
  state.running=true; state.score=0; state.lives=3; state.level=1; state.time=0; state.asteroids=[]; state.bullets=[]; state.particles=[]; state.lastSpawn=performance.now(); state.spawnInterval=2000;
  resetShip(); for(let i=0;i<3;i++) spawnAsteroid(false, 40+Math.random()*20);
  center.classList.add('hidden');
}
function gameOver(){
  state.running=false;
  if(state.score>high){ high=state.score; localStorage.setItem('asteroids_high', high); highTxt.textContent=`NEW HIGH ${high}!`; } else highTxt.textContent=`HIGH ${high} • SCORE ${state.score}`;
  document.querySelector('#center h1').textContent='GAME OVER';
  document.querySelector('#center p').innerHTML=`<span style="color:#facc15">Score ${state.score}</span> • Level ${state.level}<br>Time ${Math.floor(state.time/1000)}s • Asteroids density x${(1+state.level*0.22).toFixed(1)} • HP up to ${1+Math.floor(state.level*0.6)}`;
  document.getElementById('startBtn').textContent='↻ REPLAY';
  center.classList.remove('hidden');
}

document.getElementById('startBtn').onclick=startGame;
addEventListener('keydown',e=>{ state.keys[e.key]=true; if(e.key===' ' ) e.preventDefault(); if(!state.running && (e.key==='Enter'||e.key===' ')) startGame(); });
addEventListener('keyup',e=>state.keys[e.key]=false);

function bindTouch(id, key){ const el=document.getElementById(id); if(!el) return; const set=v=>{ state.touch[key]=v; }; el.addEventListener('touchstart',e=>{ e.preventDefault(); set(true); },{passive:false}); el.addEventListener('touchend',e=>{ e.preventDefault(); set(false); },{passive:false}); el.addEventListener('mousedown',()=>set(true)); el.addEventListener('mouseup',()=>set(false)); el.addEventListener('mouseleave',()=>set(false)); }
bindTouch('leftBtn','left'); bindTouch('rightBtn','right'); bindTouch('thrustBtn','thrust'); bindTouch('shootBtn','shoot');

canvas.addEventListener('touchstart',e=>{ if(!state.running) return; const t=e.touches[0]; if(t.clientX > W*0.5) state.touch.shoot=true; },{passive:false});
canvas.addEventListener('touchend',e=>{ state.touch.shoot=false; },{passive:false});

document.addEventListener('visibilitychange',()=>{ if(document.hidden) { /* pause not implemented */ } });
</script>
</body>
</html>
