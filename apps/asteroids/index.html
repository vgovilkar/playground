<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Asteroids Infinite - Playground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
  body { background:#040507; overflow:hidden; font-family: 'Courier New', monospace; color:#fff; }
  canvas { display:block; position:absolute; top:0; left:0; background:radial-gradient(ellipse at center, #0a0e1a 0%, #040507 70%); }
  #ui { position:absolute; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; pointer-events:none; font-size:14px; z-index:10; }
  #ui div { background:rgba(0,0,0,0.6); border:1px solid #1e293b; padding:8px 12px; border-radius:999px; backdrop-filter:blur(6px); }
  #level { color:#38bdf8; } #score { color:#facc15; } #lives { color:#fb7185; }
  #center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:20; background:rgba(4,5,7,0.85); backdrop-filter:blur(8px); }
  #center.hidden { display:none; }
  h1 { font-size:48px; letter-spacing:0.2em; text-shadow:0 0 20px #38bdf8; margin-bottom:10px; text-align:center; width:100%; transform:translateX(0.1em); }
  #center p { opacity:0.7; margin:6px 0; text-align:center; max-width:360px; line-height:1.5; }
  button.primary { margin-top:20px; padding:14px 28px; border-radius:999px; border:1px solid #38bdf8; background:#0c4a6e; color:#fff; font-family:inherit; font-size:16px; cursor:pointer; box-shadow:0 0 20px rgba(56,189,248,0.4); }
  button.primary:active { transform:scale(0.97); }
  #touchNote { position:absolute; bottom:20px; left:0; right:0; text-align:center; opacity:0.35; font-size:11px; letter-spacing:0.1em; pointer-events:none; line-height:1.4; }
  #tapIndicator { position:absolute; width:44px; height:44px; border:2px dashed rgba(56,189,248,0.6); border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); display:none; z-index:12; }
  #powerups { position:absolute; top:60px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:10; pointer-events:none; }
  .pup-badge { padding:6px 12px; border-radius:999px; font-size:12px; font-weight:bold; backdrop-filter:blur(8px); border:1px solid; display:flex; align-items:center; gap:6px; }
  .pup-rapid { background:rgba(56,189,248,0.15); border-color:rgba(56,189,248,0.5); color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,0.3); }
  .pup-spread { background:rgba(232,121,249,0.15); border-color:rgba(232,121,249,0.5); color:#e879f9; box-shadow:0 0 12px rgba(232,121,249,0.3); }
  #muteBtn { position:absolute; top:14px; right:14px; z-index:25; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.5); color:#fff; font-size:16px; cursor:pointer; backdrop-filter:blur(6px); pointer-events:auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div><span id="level">LVL 1</span> • <span id="score">0</span> • <span id="lives">♥♥♥</span></div>
  <div id="stats">AST: 0 | FPS: 60</div>
</div>
<div id="powerups"></div>
<div id="touchNote"></div>
<div id="tapIndicator"></div>
<button id="muteBtn" title="Toggle sound">🔊</button>
<div id="center">
  <h1>ASTEROIDS INFINITE</h1>
  <p id="instrMobile" style="font-size:14px; line-height:1.6; display:none"><span style="color:#38bdf8">Tap anywhere</span> to turn & thrust<br><span style="font-size:11px; opacity:0.7">Auto-firing • ⚡ ◈ ♥ 🛡️ ☢ 💫</span></p>
  <p id="instrPC" style="font-size:14px; line-height:1.6; display:none"><span style="color:#e2e8f0">WASD / Arrow keys</span> to move<br><span style="font-size:11px; opacity:0.7">Auto-firing • ⚡ ◈ ♥ 🛡️ ☢ 💫</span></p>
  <button class="primary" id="startBtn">▶ PLAY</button>
  <button class="primary" id="whatsappBtn" style="display:none; background:#128C7E; border-color:#25D366; box-shadow:0 0 20px rgba(37,211,102,0.35); margin-top:10px; font-size:13px; padding:10px 20px;">↗ Share score on WhatsApp</button>
  <p id="highScoreTxt" style="margin-top:18px;font-size:12px;color:#facc15"></p>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); addEventListener('resize',resize);

const state={ running:false, awaitingRespawn:false, score:0, lives:3, level:1, time:0, lastSpawn:0, spawnInterval:2000, asteroids:[], bullets:[], particles:[], pulses:[], powerups:[], active:{rapid:false, spread:false, shield:0, pulse:false}, nextPowerupScore:400, lastPulse:0, keys:{}, touch:{thrust:false, tx:0, ty:0, active:false}, lastTime:0, fps:60 };

const ship={ x:0,y:0, angle:-Math.PI/2, vx:0,vy:0, r:14, inv:0, thrusting:false, cooldown:0 };

const levelUi=document.getElementById('level'), scoreUi=document.getElementById('score'), livesUi=document.getElementById('lives'), statsUi=document.getElementById('stats'), center=document.getElementById('center'), highTxt=document.getElementById('highScoreTxt');

let high=parseInt(localStorage.getItem('asteroids_high')||'0'); highTxt.textContent=high?`HIGH ${high}`:'No high score yet';

// --- Audio (Web Audio API, no external files) ---
let audioCtx=null, muted=false, thrustOsc=null, thrustGain=null, thrustPlaying=false;
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function playTone(freq, type, vol, dur, slideTo){
  if(!audioCtx||muted) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
function playShoot(){ playTone(1200,'triangle',0.07,0.07,350); }
function playExplode(isBig){ if(!audioCtx||muted) return; const f=isBig?120:180; playTone(f,'sawtooth',0.35, isBig?0.35:0.22, 20); setTimeout(()=>playTone(f*1.5,'triangle',0.15,0.15,30), 30); }
function playPowerup(type){
  if(!audioCtx||muted) return;
  if(type==='rapid'){ playTone(440,'sine',0.3,0.15,660); setTimeout(()=>playTone(660,'sine',0.25,0.2,880),80); }
  else if(type==='spread'){ playTone(330,'sine',0.3,0.15,495); setTimeout(()=>playTone(495,'sine',0.25,0.15,660),100); setTimeout(()=>playTone(660,'sine',0.2,0.2,880),200); }
  else if(type==='life'){ playTone(523,'sine',0.35,0.18,659); setTimeout(()=>playTone(659,'sine',0.3,0.18,784),120); setTimeout(()=>playTone(784,'sine',0.3,0.3,1046),240); }
  else if(type==='shield'){ playTone(330,'sine',0.3,0.2,440); setTimeout(()=>playTone(440,'sine',0.3,0.2,550),100); setTimeout(()=>playTone(550,'sine',0.35,0.4,660),200); }
  else if(type==='pulse'){ playTone(200,'sine',0.3,0.25,400); setTimeout(()=>playTone(400,'sine',0.28,0.25,600),120); setTimeout(()=>playTone(600,'sine',0.22,0.35,300),260); }
  else if(type==='nuke'){ playTone(110,'sawtooth',0.4,0.6,20); setTimeout(()=>playTone(220,'square',0.3,0.4,40),100); setTimeout(()=>playTone(55,'triangle',0.5,0.8,10),0); }
}
function playHit(){ playTone(120,'square',0.25,0.18,40); }
function playDeath(){
  if(!audioCtx||muted) return;
  // dramatic layered explosion
  playTone(200,'sawtooth',0.5,0.4,15);
  playTone(300,'square',0.35,0.3,20);
  setTimeout(()=>{ playTone(150,'triangle',0.4,0.5,10); }, 80);
  setTimeout(()=>{ playTone(90,'sawtooth',0.45,0.6,10); }, 150);
  setTimeout(()=>{ playTone(400,'sine',0.2,0.3,100); }, 200);
  // rumble
  if(audioCtx){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=400;
    o.type='sawtooth'; o.frequency.setValueAtTime(80, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime+0.9);
    g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.9);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.9);
  }
}
function updateThrustSound(){
  if(!audioCtx) return;
  if(ship.thrusting && state.running && !muted){
    if(!thrustPlaying){
      thrustOsc=audioCtx.createOscillator(); thrustGain=audioCtx.createGain();
      thrustOsc.type='sawtooth'; thrustOsc.frequency.value=70; thrustGain.gain.value=0;
      thrustOsc.connect(thrustGain); thrustGain.connect(audioCtx.destination); thrustOsc.start(); thrustPlaying=true;
    }
    thrustGain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.06);
    if(thrustOsc) thrustOsc.frequency.setTargetAtTime(70+Math.random()*10, audioCtx.currentTime, 0.1);
  } else {
    if(thrustPlaying && thrustGain){
      thrustGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.12);
      setTimeout(()=>{ if(thrustOsc){ try{thrustOsc.stop();}catch{} thrustOsc=null; } thrustPlaying=false; },180);
    }
  }
}
document.getElementById('muteBtn').onclick=()=>{
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(!muted) initAudio();
  if(muted && thrustPlaying && thrustGain){ thrustGain.gain.value=0; }
};

function resetShip(){ ship.x=W/2; ship.y=H/2; ship.vx=0; ship.vy=0; ship.angle=-Math.PI/2; ship.inv=180; }
function wrap(o){ if(o.x<-50)o.x=W+50; if(o.x>W+50)o.x=-50; if(o.y<-50)o.y=H+50; if(o.y>H+50)o.y=-50; }

function randPoly(radius, irregularity){ const n=7+Math.floor(Math.random()*5); const pts=[]; for(let i=0;i<n;i++){ const ang=(i/n)*Math.PI*2; const r=radius*(0.7+Math.random()*0.6*irregularity); pts.push([Math.cos(ang)*r, Math.sin(ang)*r]); } return pts; }

function spawnAsteroid(edge=true, forcedR=null){
  const level=state.level;
  const baseR=forcedR|| (18+Math.random()*26 + level*0.4);
  const hp = Math.max(1, Math.floor(1 + level*0.25 + Math.random()*level*0.2 + (baseR>34?1:0)));
  const speed = (0.55 + Math.random()*0.9 + level*0.06) * (0.7+Math.random()*0.4);
  let x,y,ang;
  if(edge){ const side=Math.floor(Math.random()*4); if(side===0){x=-60; y=Math.random()*H; ang=Math.random()*0.8-0.4} else if(side===1){x=W+60; y=Math.random()*H; ang=Math.PI+Math.random()*0.8-0.4} else if(side===2){x=Math.random()*W; y=-60; ang=Math.PI/2+Math.random()*0.8-0.4} else {x=Math.random()*W; y=H+60; ang=-Math.PI/2+Math.random()*0.8-0.4} } else { x=ship.x + (Math.random()>0.5?1:-1)*(200+Math.random()*W*0.3); y=ship.y + (Math.random()>0.5?1:-1)*(200+Math.random()*H*0.3); ang=Math.random()*Math.PI*2; }
  state.asteroids.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, r:baseR, hp, maxHp:hp, poly:randPoly(baseR,1), rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.04, hitFlash:0 });
}

function levelConfig(l){
  return {
    spawnInterval: Math.max(900, 2400 - l*40),
    density: Math.floor(2 + l*0.3),
    speedMult: 1 + l*0.04,
    hpBonus: Math.floor(l*0.25)
  };
}

function addScore(asteroid){
  const base = asteroid.maxHp * (asteroid.r>40? 32 : asteroid.r>25? 18 : 9);
  const mult = 1 + state.level*0.10 + state.time/180000;
  const pts = Math.floor(base*mult);
  state.score+=pts;
  state.particles.push({ x:asteroid.x, y:asteroid.y, vx:(Math.random()-0.5)*1.2, vy:-1.2, life:60, max:60, type:'text', txt:`+${pts}`, color:'#facc15' });
  checkPowerupMilestone();
}

const POWERUP_UNLOCKS=[
  {score:0, type:'rapid'},
  {score:800, type:'shield'},
  {score:1500, type:'life'},
  {score:2500, type:'spread'},
  {score:4000, type:'nuke'},
  {score:7500, type:'pulse'}
];
function getUnlockedTypes(){
  return POWERUP_UNLOCKS.filter(u=>state.score>=u.score).map(u=>u.type);
}

function spawnPowerup(type=null){
  const unlocked=getUnlockedTypes();
  if(unlocked.length===0) return;
  if(!type){
    // equally likely among unlocked
    type=unlocked[Math.floor(Math.random()*unlocked.length)];
  } else {
    // if requested type not yet unlocked, don't spawn
    if(!unlocked.includes(type)) return;
  }
  const x = 80 + Math.random()*(W-160);
  const y = 80 + Math.random()*(H-240);
  const ang=Math.random()*Math.PI*2;
  state.powerups.push({ x,y, vx: Math.cos(ang)*0.3, vy: Math.sin(ang)*0.3, r:18, type, life: 720, maxLife:720, rot:0, pulse:0 });
  const txtMap={ rapid:'⚡ RAPID!', spread:'◈ SPREAD!', life:'♥ LIFE!', shield:'🛡️ SHIELD!', nuke:'☢ NUKE!', pulse:'💫 PULSE!' };
  const colMap={ rapid:'#38bdf8', spread:'#e879f9', life:'#4ade80', shield:'#60a5fa', nuke:'#fb923c', pulse:'#a78bfa' };
  state.particles.push({ x:W/2, y:70, vx:0, vy:-0.3, life:90, max:90, type:'text', txt: txtMap[type]||'POWERUP!', color: colMap[type]||'#fff' });
}

let lastUnlockCount=0;
function checkUnlocks(){
  const unlocked=getUnlockedTypes();
  if(unlocked.length>lastUnlockCount){
    for(let i=lastUnlockCount;i<unlocked.length;i++){
      const u=POWERUP_UNLOCKS[i];
      const names={ rapid:'⚡ RAPID FIRE', shield:'🛡️ SHIELD (3 hits)', life:'♥ LIFE', spread:'◈ SPREAD 3-way', nuke:'☢ NUKE' };
      state.particles.push({ x:W/2, y:H/2-40, vx:0, vy:-0.6, life:140, max:140, type:'text', txt:`UNLOCKED: ${names[u.type]||u.type.toUpperCase()}!`, color:'#facc15' });
      // extra flash
      for(let k=0;k<16;k++) state.particles.push({ x:W/2, y:H/2, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, life:30, max:30, type:'dot', color:'#facc15', size:2 });
    }
    lastUnlockCount=unlocked.length;
  }
}
function checkPowerupMilestone(){
  checkUnlocks();
  while(state.score >= state.nextPowerupScore){
    if(Math.random() < 0.65){
      spawnPowerup();
    } else {
      state.particles.push({ x:W/2, y:50, vx:0, vy:-0.2, life:60, max:60, type:'text', txt:`${state.nextPowerupScore} PTS`, color:'#64748b' });
    }
    state.nextPowerupScore+=400;
  }
}

function explode(x,y, r, color='#38bdf8', count= 12){
  for(let i=0;i<count;i++){ state.particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:20+Math.random()*20, max:40, type:'dot', color, size:1+Math.random()*3 }); }
  for(let i=0;i<r/8;i++){ state.particles.push({ x,y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:40+Math.random()*20, max:60, type:'chunk', color, size:1+Math.random()*2 }); }
}
function bigDeathExplosion(x,y){
  // dramatic multi-layer explosion
  for(let i=0;i<40;i++){ state.particles.push({ x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:30+Math.random()*30, max:60, type:'dot', color:'#ffffff', size:2+Math.random()*4 }); }
  for(let i=0;i<24;i++){ state.particles.push({ x,y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:35+Math.random()*25, max:60, type:'chunk', color:'#fb7185', size:2+Math.random()*3 }); }
  for(let i=0;i<16;i++){ state.particles.push({ x,y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:40+Math.random()*20, max:60, type:'dot', color:'#facc15', size:1+Math.random()*3 }); }
  // shockwave rings
  state.particles.push({ x,y, vx:0, vy:0, life:30, max:30, type:'ring', r:10, color:'#38bdf8' });
  state.particles.push({ x,y, vx:0, vy:0, life:40, max:40, type:'ring', r:5, color:'#ffffff' });
}

function updateKeys(dtNorm){
  // tap-to-thrust: turn first, thrust only when aligned — allows microtweaks without moving
  if(state.touch.active && state.running){
    const dx=state.touch.tx - ship.x, dy=state.touch.ty - ship.y;
    const dist=Math.hypot(dx,dy);
    const targetAng=Math.atan2(dy,dx);
    let diff=targetAng - ship.angle; diff=Math.atan2(Math.sin(diff), Math.cos(diff));
    ship.angle+=diff*0.16*dtNorm; // turn toward tap

    // only thrust once aligned within ~10 deg, and not for tiny micro-tweaks unless held
    const alignThreshold = 0.18; // ~10 deg
    const shouldThrust = Math.abs(diff) < alignThreshold && dist > 26;
    ship.thrusting = shouldThrust;
    if(shouldThrust){
      const thrust=0.13*dtNorm;
      ship.vx+=Math.cos(ship.angle)*thrust;
      ship.vy+=Math.sin(ship.angle)*thrust;
      if(Math.random()<0.7) state.particles.push({ x: ship.x - Math.cos(ship.angle)*ship.r, y: ship.y - Math.sin(ship.angle)*ship.r, vx: ship.vx + (Math.random()-0.5)*2 - Math.cos(ship.angle)*2, vy: ship.vy + (Math.random()-0.5)*2 - Math.sin(ship.angle)*2, life:12, max:12, type:'dot', color:'#fb7185', size:2 });
    }
  } else {
    // keyboard rotate
    if(state.keys['ArrowLeft']||state.keys['a']) ship.angle-=0.08*dtNorm;
    if(state.keys['ArrowRight']||state.keys['d']) ship.angle+=0.08*dtNorm;
    if(state.keys['ArrowUp']||state.keys['w']){ ship.thrusting=true; const thrust=0.18*dtNorm; ship.vx+=Math.cos(ship.angle)*thrust; ship.vy+=Math.sin(ship.angle)*thrust; if(Math.random()<0.6) state.particles.push({ x: ship.x - Math.cos(ship.angle)*ship.r, y: ship.y - Math.sin(ship.angle)*ship.r, vx: ship.vx + (Math.random()-0.5)*2 - Math.cos(ship.angle)*2, vy: ship.vy + (Math.random()-0.5)*2 - Math.sin(ship.angle)*2, life:12, max:12, type:'dot', color:'#fb7185', size:2 }); } else if(!state.touch.active) ship.thrusting=false;
  }

  // continuous auto-fire - rapid persists till death
  const baseCooldown = state.active.rapid ? 6 : 14;
  if(state.running && ship.cooldown<=0){
    const angles = state.active.spread ? [-0.26, 0, 0.26] : [0];
    for(const off of angles){
      const ang = ship.angle + off;
      state.bullets.push({ x: ship.x + Math.cos(ang)*ship.r, y: ship.y + Math.sin(ang)*ship.r, vx: Math.cos(ang)*7 + ship.vx*0.3, vy: Math.sin(ang)*7 + ship.vy*0.3, life:60 });
    }
    ship.cooldown=baseCooldown;
    playShoot();
  }
  // friction + max speed cap — fix mobile "speeding up"
  const friction = ship.thrusting ? 0.99 : 0.985;
  ship.vx*=Math.pow(friction, dtNorm); ship.vy*=Math.pow(friction, dtNorm);
  const maxSpeed = 5.5;
  const spd = Math.hypot(ship.vx, ship.vy);
  if(spd > maxSpeed){ ship.vx = (ship.vx/spd)*maxSpeed; ship.vy = (ship.vy/spd)*maxSpeed; }
  ship.x+=ship.vx*dtNorm; ship.y+=ship.vy*dtNorm; wrap(ship);
  if(ship.cooldown>0) ship.cooldown-=dtNorm;
  if(ship.inv>0) ship.inv-=dtNorm;
}

function update(dt, dtNorm){
  state.time+=dt;
  // powerups now last till death, not timer - no decrement

  // Difficulty now scales by SCORE, more gradual
  const newLevel=1+Math.floor(state.score/1200);
  if(newLevel!==state.level){ state.level=newLevel; state.particles.push({ x:W/2, y:100, vx:0, vy:-0.5, life:120, max:120, type:'text', txt:`LEVEL ${state.level}`, color:'#38bdf8' }); }
  const cfg=levelConfig(state.level);
  state.spawnInterval=cfg.spawnInterval;

  if(state.running && performance.now()-state.lastSpawn > state.spawnInterval){
    const count=1+Math.floor(Math.random()*(cfg.density>4?2:1));
    for(let i=0;i<count;i++) spawnAsteroid(true);
    state.lastSpawn=performance.now();
    if(Math.random()<0.05+state.level*0.01){ for(let i=0;i<1+Math.floor(state.level/6);i++) spawnAsteroid(true, 20+Math.random()*25); }
  }

  // bullets - framerate independent
  for(let i=state.bullets.length-1;i>=0;i--){ const b=state.bullets[i]; b.x+=b.vx*dtNorm; b.y+=b.vy*dtNorm; b.life-=dtNorm; if(b.life<=0|| b.x<-100||b.x>W+100||b.y<-100||b.y>H+100) state.bullets.splice(i,1); }

  // asteroids - framerate independent movement
  for(let i=state.asteroids.length-1;i>=0;i--){ const a=state.asteroids[i]; a.x+=a.vx*dtNorm; a.y+=a.vy*dtNorm; a.rot+=a.rotV*dtNorm; wrap(a); if(a.hitFlash>0) a.hitFlash-=dtNorm; // bullet hits
    for(let j=state.bullets.length-1;j>=0;j--){ const b=state.bullets[j]; const dx=b.x-a.x, dy=b.y-a.y; if(dx*dx+dy*dy < a.r*a.r){ state.bullets.splice(j,1); a.hp--; a.hitFlash=6; explode(b.x,b.y,4, a.maxHp>2?'#f87171':'#38bdf8', 3); if(a.hp<=0){ addScore(a); explode(a.x,a.y,a.r, a.maxHp>2?'#fb7185':'#e2e8f0', Math.floor(a.r/2.5)); playExplode(a.r>30); // split smaller
      if(a.r>16){ const kids= a.r>30?3:2; for(let k=0;k<kids;k++){ const nr=Math.max(9, a.r*0.52); const nang=Math.random()*Math.PI*2; const nspd= (Math.random()*1+0.6)*(1+state.level*0.05); state.asteroids.push({ x:a.x + Math.cos(nang)*10, y:a.y + Math.sin(nang)*10, vx: a.vx*0.5 + Math.cos(nang)*nspd, vy: a.vy*0.5 + Math.sin(nang)*nspd, r:nr, hp: Math.max(1, Math.floor(a.maxHp*0.6)), maxHp: Math.max(1, Math.floor(a.maxHp*0.6)), poly:randPoly(nr,1), rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.08, hitFlash:0 }); } } state.asteroids.splice(i,1); break; } } }
    // ship collision - shield or dramatic death
    if(state.running && ship.inv<=0 && !state.awaitingRespawn){ const dx=ship.x-a.x, dy=ship.y-a.y; if(dx*dx+dy*dy < (a.r+ship.r)*(a.r+ship.r)*0.7){
      if(state.active.shield>0){
        // shield absorbs hit
        state.active.shield--;
        addScore(a);
        explode(a.x,a.y,a.r, '#60a5fa', Math.floor(a.r/2));
        state.asteroids.splice(i,1);
        // shield hit effect
        explode(ship.x,ship.y, 20, '#60a5fa', 12);
        state.particles.push({ x:ship.x, y:ship.y-18, vx:0, vy:-0.8, life:50, max:50, type:'text', txt: state.active.shield>0?`SHIELD ${state.active.shield}`:'SHIELD BROKEN!', color: state.active.shield>0?'#60a5fa':'#fb7185' });
        playTone(180,'sine',0.25,0.2,90);
        if(state.active.shield<=0){
          state.particles.push({ x:W/2, y:H/2, vx:0, vy:0, life:70, max:70, type:'text', txt:'SHIELD DOWN!', color:'#fb7185' });
        }
        break;
      }
      // no shield - lose life, clear all powerups (last till death)
      state.lives--;
      state.active.rapid=false;
      state.active.spread=false;
      state.active.shield=0;
      state.active.pulse=false;
      if(state.lives<=0){
        bigDeathExplosion(ship.x,ship.y);
        explode(ship.x,ship.y, ship.r*2, '#ffffff', 30);
        playDeath();
        gameOver();
      } else {
        bigDeathExplosion(ship.x,ship.y);
        explode(ship.x,ship.y, ship.r*1.5, '#ffffff', 24);
        playDeath();
        state.awaitingRespawn=true;
        state.running=false;
        ship.thrusting=false;
        document.getElementById('center').querySelector('h1').innerHTML=`<span style="font-size:20px; letter-spacing:0.1em; color:#fb7185">DESTROYED</span><br><span style="font-size:52px; color:#4ade80; text-shadow:0 0 20px rgba(74,222,128,0.5); line-height:1.1">${'♥'.repeat(state.lives)}</span><br><span style="font-size:14px; color:#4ade80">${state.lives} ${state.lives===1?'LIFE':'LIVES'} LEFT</span>`;
        document.getElementById('center').querySelector('h1').style.color='#fff';
        document.getElementById('center').querySelector('p').innerHTML=`<span style="font-size:11px; opacity:0.5">Game not over • Powerups cleared</span>`;
        document.getElementById('startBtn').textContent=`▶ CONTINUE`;
        document.getElementById('startBtn').onclick=doRespawn;
        document.getElementById('whatsappBtn').style.display='none';
        document.getElementById('center').classList.remove('hidden');
      }
      break;
    } }
  }

  // powerups - floating and collection
  for(let i=state.powerups.length-1;i>=0;i--){
    const pu=state.powerups[i];
    pu.x+=pu.vx*dtNorm; pu.y+=pu.vy*dtNorm; pu.rot+=0.03*dtNorm; pu.pulse+=0.08*dtNorm; pu.life-=dtNorm;
    wrap(pu);
    if(pu.life<=0){ state.powerups.splice(i,1); continue; }
    // collect
    if(state.running){ const dx=ship.x-pu.x, dy=ship.y-pu.y; if(dx*dx+dy*dy < (pu.r+ship.r)*(pu.r+ship.r)){ 
      playPowerup(pu.type);
      if(pu.type==='rapid' || pu.type==='spread'){
        state.active[pu.type]=true;
        state.score+=50;
        explode(pu.x,pu.y,16, pu.type==='rapid' ? '#38bdf8' : '#e879f9', 18);
        state.particles.push({ x:pu.x, y:pu.y-20, vx:0, vy:-1, life:60, max:60, type:'text', txt: pu.type==='rapid'?'RAPID 2x!':'SPREAD 3x!', color: pu.type==='rapid'?'#38bdf8':'#e879f9' });
      } else if(pu.type==='life'){
        state.lives = Math.min(99, state.lives+1);
        state.score+=50;
        explode(pu.x,pu.y,20, '#4ade80', 22);
        state.particles.push({ x:pu.x, y:pu.y-20, vx:0, vy:-1, life:70, max:70, type:'text', txt:'+1 LIFE!', color:'#4ade80' });
      } else if(pu.type==='shield'){
        state.active.shield=3;
        state.score+=50;
        explode(pu.x,pu.y,20, '#60a5fa', 20);
        state.particles.push({ x:pu.x, y:pu.y-20, vx:0, vy:-1, life:70, max:70, type:'text', txt:'SHIELD 3 HITS!', color:'#60a5fa' });
      } else if(pu.type==='pulse'){
        state.active.pulse=true;
        state.lastPulse=performance.now();
        state.score+=50;
        explode(pu.x,pu.y,22, '#a78bfa', 22);
        state.particles.push({ x:pu.x, y:pu.y-20, vx:0, vy:-1, life:70, max:70, type:'text', txt:'PULSE EVERY 3s!', color:'#a78bfa' });
      } else if(pu.type==='nuke'){
        let nuked=0;
        for(let k=state.asteroids.length-1;k>=0;k--){
          const a=state.asteroids[k];
          addScore(a);
          explode(a.x,a.y,a.r, '#fb923c', Math.floor(a.r/2));
          state.asteroids.splice(k,1);
          nuked++;
        }
        state.score+=100;
        explode(pu.x,pu.y,40, '#fb923c', 30);
        state.particles.push({ x:W/2, y:H/2, vx:0, vy:0, life:90, max:90, type:'text', txt:`NUKE! ${nuked} DESTROYED +100`, color:'#fb923c' });
      }
      state.powerups.splice(i,1);
    } }
  }

  // pulse powerup - emits every 2s till death
  if(state.running && state.active.pulse && performance.now()-state.lastPulse > 2000){
    state.pulses.push({ x:ship.x, y:ship.y, r:0, maxR:180, life:26, maxLife:26 });
    state.lastPulse=performance.now();
    // sound
    playTone(300,'sine',0.25,0.2,150);
    setTimeout(()=>playTone(600,'sine',0.18,0.25,900), 80);
  }
  // update pulses - expanding rings that destroy asteroids they touch
  for(let i=state.pulses.length-1;i>=0;i--){
    const pul=state.pulses[i];
    pul.r += 7.2*dtNorm; // 0->180 in ~25 frames (~400ms)
    pul.life-=dtNorm;
    // destroy asteroids touched by pulse circle
    for(let k=state.asteroids.length-1;k>=0;k--){
      const a=state.asteroids[k];
      const dx=a.x-pul.x, dy=a.y-pul.y;
      const dist=Math.hypot(dx,dy);
      if(dist < pul.r + a.r*0.6){
        addScore(a);
        explode(a.x,a.y,a.r, '#a78bfa', Math.floor(a.r/2.2));
        state.asteroids.splice(k,1);
      }
    }
    if(pul.r>=pul.maxR || pul.life<=0) state.pulses.splice(i,1);
  }

  // particles - framerate independent
  for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; p.x+=p.vx*dtNorm; p.y+=p.vy*dtNorm; p.vy+=0.02*dtNorm; p.life-=dtNorm; if(p.life<=0) state.particles.splice(i,1); }

  // UI - allow beyond 3 lives, no negative repeat crash
  levelUi.textContent=`LVL ${state.level}`; scoreUi.textContent=`${state.score}`;
  if(state.lives<=5) livesUi.textContent='♥'.repeat(state.lives)+'♡'.repeat(Math.max(0,3-state.lives));
  else livesUi.textContent='♥'+state.lives;
  statsUi.textContent=`AST: ${state.asteroids.length} | NEXT PU: ${state.nextPowerupScore}`;
  // powerup badges - persist till death, shield shows hits, pulse shows active
  const puDiv=document.getElementById('powerups');
  let html='';
  if(state.active.rapid) html+=`<div class="pup-badge pup-rapid">⚡ RAPID</div>`;
  if(state.active.spread) html+=`<div class="pup-badge pup-spread">◈ SPREAD</div>`;
  if(state.active.shield>0) html+=`<div class="pup-badge" style="background:rgba(96,165,250,0.15);border-color:rgba(96,165,250,0.5);color:#60a5fa;box-shadow:0 0 12px rgba(96,165,250,0.3)">🛡️ SHIELD ${state.active.shield}</div>`;
  if(state.active.pulse) html+=`<div class="pup-badge" style="background:rgba(167,139,250,0.15);border-color:rgba(167,139,250,0.5);color:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,0.3)">💫 PULSE 2s</div>`;
  puDiv.innerHTML=html;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // starfield
  ctx.fillStyle='rgba(255,255,255,0.4)'; for(let i=0;i<80;i++){ const x=(i*137.5)%W, y=(i*73.3 + state.time*0.02)%H; ctx.fillRect(x,y, (i%3?1:1.5), (i%3?1:1.5)); }
  // asteroids
  for(const a of state.asteroids){
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
    const hpPct=a.hp/a.maxHp;
    ctx.strokeStyle= a.hitFlash>0? '#fff' : hpPct<0.4?'#fb7185': a.maxHp>2?'#fbbf24':'#e2e8f0';
    ctx.lineWidth= a.maxHp>2?2.2:1.6;
    ctx.shadowColor= a.maxHp>2?'#fbbf24':'#38bdf8'; ctx.shadowBlur= a.hitFlash?12: a.maxHp>2?10:6;
    ctx.beginPath(); const pts=a.poly; ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.stroke();
    // hp bar for tough
    if(a.maxHp>1){ ctx.shadowBlur=0; ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(-a.r, -a.r-12, a.r*2, 4); ctx.fillStyle= hpPct<0.4?'#ef4444':'#22c55e'; ctx.fillRect(-a.r, -a.r-12, a.r*2*hpPct, 4); ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.fillText(`${a.hp}`,0,-a.r-18); }
    ctx.restore();
  }
  // powerups - shield distinct shape vs nuke circle
  for(const pu of state.powerups){
    const pulse = Math.sin(pu.pulse*2)*0.15+1;
    const alpha = Math.min(1, pu.life/60);
    ctx.save(); ctx.translate(pu.x,pu.y); ctx.rotate(pu.rot); ctx.globalAlpha=alpha;
    const isRapid = pu.type==='rapid';
    const isSpread = pu.type==='spread';
    const isLife = pu.type==='life';
    const isShield = pu.type==='shield';
    const isNuke = pu.type==='nuke';
    const isPulse = pu.type==='pulse';
    let col, bg, icon, label;
    if(isRapid){ col='#38bdf8'; bg='rgba(56,189,248,0.2)'; icon='⚡'; label='RAPID'; }
    else if(isSpread){ col='#e879f9'; bg='rgba(232,121,249,0.2)'; icon='◈'; label='SPREAD'; }
    else if(isLife){ col='#4ade80'; bg='rgba(74,222,128,0.22)'; icon='♥'; label='LIFE'; }
    else if(isShield){ col='#60a5fa'; bg='rgba(96,165,250,0.25)'; icon='🛡'; label='SHIELD'; }
    else if(isPulse){ col='#a78bfa'; bg='rgba(167,139,250,0.25)'; icon='💫'; label='PULSE'; }
    else { col='#fb923c'; bg='rgba(251,146,60,0.22)'; icon='☢'; label='NUKE'; }
    ctx.shadowColor=col; ctx.shadowBlur=18*pulse;
    ctx.strokeStyle=col; ctx.lineWidth=2;
    if(isShield){
      // shield shape - pointed bottom, distinct from nuke circle
      const r=pu.r + 6*Math.sin(pu.pulse*3);
      ctx.beginPath();
      ctx.moveTo(-r*0.85, -r*0.6);
      ctx.lineTo(r*0.85, -r*0.6);
      ctx.lineTo(r*0.75, r*0.2);
      ctx.lineTo(0, r*1.15);
      ctx.lineTo(-r*0.75, r*0.2);
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle=bg;
      ctx.beginPath();
      ctx.moveTo(-pu.r*0.85, -pu.r*0.6);
      ctx.lineTo(pu.r*0.85, -pu.r*0.6);
      ctx.lineTo(pu.r*0.75, pu.r*0.2);
      ctx.lineTo(0, pu.r*1.15);
      ctx.lineTo(-pu.r*0.75, pu.r*0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0,0, pu.r + 6*Math.sin(pu.pulse*3), 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle=bg;
      ctx.beginPath(); ctx.arc(0,0, pu.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font=`bold ${isRapid||isLife||isShield?16:14}px monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(icon, 0, 1);
    ctx.font='9px monospace'; ctx.fillStyle=col; ctx.fillText(label, 0, pu.r+18);
    ctx.restore();
  }
  // pulses - expanding rings from pulse powerup
  for(const pul of state.pulses){
    const prog=pul.r / pul.maxR;
    const alpha=1-prog;
    ctx.save(); ctx.translate(pul.x,pul.y);
    ctx.globalAlpha=alpha*0.7;
    ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2+ (1-prog)*2; ctx.shadowColor='#a78bfa'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(0,0, pul.r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha=alpha*0.25;
    ctx.fillStyle='rgba(167,139,250,0.15)';
    ctx.beginPath(); ctx.arc(0,0, pul.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // bullets
  ctx.fillStyle='#facc15'; ctx.shadowColor='#facc15'; ctx.shadowBlur=8; for(const b of state.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,Math.PI*2); ctx.fill(); } ctx.shadowBlur=0;
  // ship with powerup aura
  
  if(state.running || state.lives>0){
    // powerup auras - distinct from immunity
    if(state.active.rapid || state.active.spread || state.active.shield>0 || state.active.pulse){
      ctx.save(); ctx.translate(ship.x,ship.y);
      if(state.active.rapid){
        ctx.strokeStyle='rgba(250,204,21,0.75)'; ctx.lineWidth=1.5; ctx.shadowColor='#facc15'; ctx.shadowBlur=10;
        ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.arc(0,0, ship.r+10+Math.sin(state.time*0.02)*2, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle='rgba(250,204,21,0.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(0,0, ship.r+6, state.time*0.02, state.time*0.02+1.2); ctx.stroke();
      }
      if(state.active.spread){
        ctx.strokeStyle='rgba(232,121,249,0.8)'; ctx.lineWidth=2; ctx.shadowColor='#e879f9'; ctx.shadowBlur=12;
        for(const off of [-0.26,0,0.26]){
          const a=off;
          ctx.beginPath(); ctx.arc(0,0, ship.r+16, a-0.18, a+0.18); ctx.stroke();
          ctx.fillStyle='rgba(232,121,249,0.9)'; ctx.beginPath(); ctx.arc(Math.cos(a)*(ship.r+16), Math.sin(a)*(ship.r+16), 2, 0, Math.PI*2); ctx.fill();
        }
        ctx.shadowBlur=0;
      }
      if(state.active.shield>0){
        const hits=state.active.shield;
        ctx.strokeStyle='rgba(96,165,250,0.8)'; ctx.lineWidth=2.2; ctx.shadowColor='#60a5fa'; ctx.shadowBlur=16;
        for(let s=0;s<hits;s++){
          ctx.beginPath(); ctx.arc(0,0, ship.r+22+s*5, (s*2.1)-0.35, (s*2.1)+1.9); ctx.stroke();
        }
      }
      if(state.active.pulse){
        // pulse - purple breathing ring, distinct
        const pr = ship.r+28 + Math.sin(state.time*0.008)*4;
        ctx.strokeStyle='rgba(167,139,250,0.55)'; ctx.lineWidth=1.8; ctx.shadowColor='#a78bfa'; ctx.shadowBlur=14;
        ctx.setLineDash([2,6]);
        ctx.beginPath(); ctx.arc(0,0, pr, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
    ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.angle);
    const flick= ship.inv>0 && Math.floor(ship.inv/6)%2===0;
    if(!flick){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.shadowColor='#38bdf8'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(ship.r,0); ctx.lineTo(-ship.r*0.7, -ship.r*0.7); ctx.lineTo(-ship.r*0.4,0); ctx.lineTo(-ship.r*0.7, ship.r*0.7); ctx.closePath(); ctx.stroke(); if(ship.thrusting){ ctx.strokeStyle='#fb7185'; ctx.shadowColor='#fb7185'; ctx.beginPath(); ctx.moveTo(-ship.r*0.4, -4); ctx.lineTo(-ship.r*1.4 + (Math.random()*6),0); ctx.lineTo(-ship.r*0.4,4); ctx.stroke(); } }
    ctx.restore();
    // immunity - white thin circle, distinct from powerup colors (yellow rapid, magenta spread, blue shield)
    if(ship.inv>0){ ctx.strokeStyle=`rgba(255,255,255,${0.2+ship.inv/300})`; ctx.lineWidth=1; ctx.shadowColor='#ffffff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(ship.x,ship.y, ship.r+10+ (180-ship.inv)/12,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0; }
  }
  // particles
  for(const p of state.particles){
    const alpha=p.life/p.max;
    if(p.type==='dot'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    else if(p.type==='chunk'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); ctx.globalAlpha=1; }
    else if(p.type==='text'){ ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.fillText(p.txt, p.x,p.y); ctx.globalAlpha=1; }
    else if(p.type==='ring'){ ctx.globalAlpha=alpha*0.8; ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.shadowColor=p.color; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(p.x,p.y, p.r + (p.max-p.life)*3, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; ctx.shadowBlur=0; }
  }
}

let last=0, fpsAcc=0, fpsCount=0;
function loop(t){
  if(!last) last=t;
  const dt=Math.min(33, t-last); const dtNorm=dt/16.666; last=t;
  fpsAcc+=1000/Math.max(dt,1); fpsCount++; if(fpsCount>30){ state.fps=Math.round(fpsAcc/fpsCount); fpsAcc=0; fpsCount=0; }
  if(state.running){ updateKeys(dtNorm); update(dt, dtNorm); updateThrustSound(); }
  else if(state.awaitingRespawn){
    // keep particles animating during death pause for dramatic effect
    for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; p.x+=p.vx*dtNorm; p.y+=p.vy*dtNorm; p.vy+=0.02*dtNorm; p.life-=dtNorm; if(p.life<=0) state.particles.splice(i,1); }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  lastUnlockCount=1; // rapid unlocked at 0

function doRespawn(){
  if(!state.awaitingRespawn) return;
  state.awaitingRespawn=false;
  state.running=true;
  resetShip();
  center.classList.add('hidden');
  document.getElementById('startBtn').onclick=()=>{ if(state.awaitingRespawn) doRespawn(); else startGame(); };
  document.getElementById('startBtn').textContent='▶ PLAY';
  document.getElementById('whatsappBtn').style.display='none';
  document.querySelector('#center h1').textContent='ASTEROIDS INFINITE';
  document.querySelector('#center h1').style.color='#fff';
  const m=document.getElementById('instrMobile'); if(m) m.innerHTML=`<span style="color:#38bdf8">Tap anywhere</span> to turn & thrust<br><span style="font-size:11px; opacity:0.7">Auto-firing • ⚡ ◈ ♥ 🛡️ ☢ 💫</span>`;
  const p=document.getElementById('instrPC'); if(p) p.innerHTML=`<span style="color:#e2e8f0">WASD / Arrow keys</span> to move<br><span style="font-size:11px; opacity:0.7">Auto-firing • ⚡ ◈ ♥ 🛡️ ☢ 💫</span>`;
  updatePlatformUI();
}
function gameOver(){
  state.running=false;
  state.awaitingRespawn=false;
  if(thrustPlaying && thrustGain){ try{ thrustGain.gain.value=0; }catch{} }
  bigDeathExplosion(W/2, H/2);
  playDeath();
  const isNewHigh = state.score>high;
  if(isNewHigh){ high=state.score; localStorage.setItem('asteroids_high', high); }
  highTxt.textContent = isNewHigh ? `NEW HIGH SCORE!` : `HIGH ${high}`;
  highTxt.style.fontSize='16px';
  highTxt.style.color=isNewHigh?'#4ade80':'#facc15';
  // most prominent score
  document.querySelector('#center h1').innerHTML=`<span style="font-size:20px; letter-spacing:0.1em; color:#fb7185">GAME OVER</span><br><span style="font-size:54px; color:#facc15; text-shadow:0 0 24px rgba(250,204,21,0.6); line-height:1.1">${state.score}</span><br><span style="font-size:12px; letter-spacing:0.2em; opacity:0.6; color:#e2e8f0">SCORE</span>`;
  document.querySelector('#center h1').style.color='#fff';
  // secondary stats less prominent
  const firstP = document.getElementById('instrMobile');
  if(firstP){
    firstP.style.display='block';
    firstP.innerHTML=`<span style="font-size:12px; opacity:0.5">Level ${state.level} • ${Math.floor(state.time/1000)}s survived • Next PU ${state.nextPowerupScore}</span>`;
  }
  const secondP = document.getElementById('instrPC');
  if(secondP) secondP.style.display='none';
  document.getElementById('startBtn').textContent='↻ REPLAY';
  document.getElementById('startBtn').onclick=startGame;
  // WhatsApp share - prominent score via link
  const waBtn=document.getElementById('whatsappBtn');
  if(waBtn){
    waBtn.style.display='inline-block';
    const shareText=`I scored ${state.score} in Asteroids Infinite! 🚀 Level ${state.level} • ${Math.floor(state.time/1000)}s survived • Can you beat it? Play here: https://www.vaibhavgovilkar.com/playground/apps/asteroids/`;
    const waUrl=`https://wa.me/?text=${encodeURIComponent(shareText)}`;
    waBtn.onclick=()=>{ window.open(waUrl, '_blank'); };
  }
  center.classList.remove('hidden');
}

document.getElementById('startBtn').onclick=()=>{ if(state.awaitingRespawn) doRespawn(); else startGame(); };
addEventListener('keydown',e=>{
  state.keys[e.key]=true;
  if(e.key===' ' ) e.preventDefault();
  if(!state.running && !state.awaitingRespawn && (e.key==='Enter'||e.key===' ')) startGame();
});
addEventListener('keyup',e=>state.keys[e.key]=false);

// Tap-anywhere thrust toward tap - no fire button, auto-fire
const indicator=document.getElementById('tapIndicator');
let mouseDown=false;

function setThrustTarget(clientX, clientY){
  if(!state.running) return;
  state.touch.tx=clientX; state.touch.ty=clientY; state.touch.active=true;
  indicator.style.left=clientX+'px'; indicator.style.top=clientY+'px'; indicator.style.display='block';
}
function clearThrust(){ state.touch.active=false; state.touch.thrust=false; indicator.style.display='none'; }

canvas.addEventListener('touchstart',e=>{
  if(state.awaitingRespawn){ e.preventDefault(); return; }
  if(!state.running) return;
  const t=e.touches[0];
  setThrustTarget(t.clientX, t.clientY);
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  if(!state.running) return;
  if(!state.touch.active) return;
  const t=e.touches[0];
  setThrustTarget(t.clientX, t.clientY);
},{passive:false});

canvas.addEventListener('touchend',e=>{
  if(e.touches.length===0) clearThrust();
  else { const t=e.touches[0]; setThrustTarget(t.clientX, t.clientY); }
},{passive:false});

// Desktop mouse: click/drag anywhere to thrust toward cursor
canvas.addEventListener('mousedown',e=>{
  if(state.awaitingRespawn) return;
  if(!state.running) return;
  if(e.button!==0) return;
  mouseDown=true;
  setThrustTarget(e.clientX, e.clientY);
  state.touch.thrust=true;
});
canvas.addEventListener('mousemove',e=>{
  if(!mouseDown) return;
  setThrustTarget(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup',e=>{
  mouseDown=false;
  state.touch.thrust=false;
  if(e.touches===undefined) clearThrust();
});
canvas.addEventListener('mouseleave',()=>{ mouseDown=false; state.touch.thrust=false; clearThrust(); });

// Platform detection - show only relevant instructions
function updatePlatformUI(){
  const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || innerWidth<=768;
  const mob=document.getElementById('instrMobile');
  const pc=document.getElementById('instrPC');
  const note=document.getElementById('touchNote');
  if(isMobile){
    if(mob) mob.style.display='block';
    if(pc) pc.style.display='none';
    if(note) note.textContent='TAP ANYWHERE TO MOVE • AUTO-FIRING';
  } else {
    if(mob) mob.style.display='none';
    if(pc) pc.style.display='block';
    if(note) note.textContent='WASD / ARROWS TO MOVE • AUTO-FIRING';
  }
}
updatePlatformUI();
addEventListener('resize', updatePlatformUI);

document.addEventListener('visibilitychange',()=>{ if(document.hidden) { /* pause not implemented */ } });
</script>
